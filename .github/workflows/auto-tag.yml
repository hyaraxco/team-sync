name: Auto Tag

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!**.md'
      - '!.github/**'
      - '.github/workflows/auto-tag.yml'
      - '.github/scripts/next-release*'
  pull_request:
    paths:
      - '.github/workflows/auto-tag.yml'
      - '.github/scripts/next-release*'

concurrency:
  group: auto-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - run: bash .github/scripts/next-release-test.sh

  auto-tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: next_version
        run: |
          git fetch origin --tags
          bash .github/scripts/next-release.sh >> "$GITHUB_OUTPUT"

      - name: Create tag
        id: create_tag
        if: steps.next_version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.next_version.outputs.version }}
        run: |
          REMOTE_TAG=$(git ls-remote --tags origin "refs/tags/$VERSION")
          if [[ -n "$REMOTE_TAG" ]]; then
            echo "Skip: remote tag $VERSION already exists."
            echo 'created=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"
          echo 'created=true' >> "$GITHUB_OUTPUT"

      - name: Create release
        if: steps.create_tag.outputs.created == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.next_version.outputs.version }}
          name: Release ${{ steps.next_version.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
